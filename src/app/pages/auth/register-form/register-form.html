<form (ngSubmit)="register()" #f="ngForm">
    <fieldset [disabled]="!!success">
        <div>
            <input name="fullName" [(ngModel)]="form.fullName" #fullName="ngModel" placeholder="Full Name" required minlength="2" />
            <div class="field-error" *ngIf="fullName.invalid && fullName.touched">
                <span *ngIf="fullName.errors?.['required']">Full name is required</span>
                <span *ngIf="fullName.errors?.['minlength']">Must be at least 2 characters</span>
            </div>
        </div>
        <div>
            <input name="username" [(ngModel)]="form.username" #username="ngModel" placeholder="Username" required minlength="3" />
            <div class="field-error" *ngIf="username.invalid && username.touched">
                <span *ngIf="username.errors?.['required']">Username is required</span>
                <span *ngIf="username.errors?.['minlength']">Must be at least 3 characters</span>
            </div>
        </div>
        <div>
            <input name="email" [(ngModel)]="form.email" #email="ngModel" type="email" placeholder="Email" required email />
            <div class="field-error" *ngIf="email.invalid && email.touched">
                <span *ngIf="email.errors?.['required']">Email is required</span>
                <span *ngIf="email.errors?.['email']">Invalid email format</span>
            </div>
        </div>
        <div>
            <input name="password" [(ngModel)]="form.password" #password="ngModel" type="password" placeholder="Password" required minlength="6" />
            <div class="field-error" *ngIf="password.invalid && password.touched">
                <span *ngIf="password.errors?.['required']">Password is required</span>
                <span *ngIf="password.errors?.['minlength']">Must be at least 6 characters</span>
            </div>
        </div>
        <div>
            <input name="phoneNumber" [(ngModel)]="form.phoneNumber" #phoneNumber="ngModel" placeholder="Phone Number" required pattern="^[0-9]{10}$" />
            <div class="field-error" *ngIf="phoneNumber.invalid && phoneNumber.touched">
                <span *ngIf="phoneNumber.errors?.['required']">Phone number is required</span>
                <span *ngIf="phoneNumber.errors?.['pattern']">Must be exactly 10 digits</span>
            </div>
        </div>
        <button type="submit" [disabled]="loading || f.invalid">
            {{ loading ? 'Creating Account...' : 'Register' }}
        </button>
    </fieldset>
    <div class="error" *ngIf="error">{{ error }}</div>
    <div class="success" *ngIf="success">{{ success }}</div>
</form>
