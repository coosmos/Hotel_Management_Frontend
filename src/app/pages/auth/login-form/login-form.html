<form (ngSubmit)="login()" #f="ngForm">
  <input #usernameInput name="username" [(ngModel)]="form.username" placeholder="Email or Username" required />

  <input name="password" [(ngModel)]="form.password" type="password" placeholder="Password" required />

  <button type="submit" [disabled]="loading || f.invalid">
    {{ loading ? 'Signing in...' : 'Login' }}
  </button>

  <div class="error" *ngIf="error">{{ error }}</div>
</form>
